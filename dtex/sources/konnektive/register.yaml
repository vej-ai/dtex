  # summary — Konnektive's own per-day transaction report. Amounts and
  # percentages are strings as sent; counts are integers.
  - name: summary
    table: summary
    primary_key: [date]
    write_disposition: merge
    incremental:
      cursor_field: date
      cursor_type: date
      # Records how far the day-walk got. The trailing re-pull is applied
      # in the connector (`summary_lookback_days`).
    schema:
